# Backup and manual trigger for Undercut's price check. The main 15-minute schedule runs on Upstash QStash
# (tools/setup-schedule.js), because GitHub's scheduler did not start reliably. Run it by hand from the
# Actions tab with "Run workflow". Needs repository secrets UNDERCUT_URL and UNDERCUT_CRON_SECRET.
name: Check prices

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger the price check
        env:
          UNDERCUT_URL: ${{ secrets.UNDERCUT_URL }}
          UNDERCUT_CRON_SECRET: ${{ secrets.UNDERCUT_CRON_SECRET }}
        run: |
          secret="$(printf '%s' "$UNDERCUT_CRON_SECRET" | tr -d '\r\n')"
          url="$(printf '%s' "$UNDERCUT_URL" | tr -d '\r\n')"
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST -H "Authorization: Bearer ${secret}" \
            "${url%/}/api/cron"
