# Runs Undercut's price check every 15 minutes, because Vercel's free plan only allows daily cron jobs
# (vercel.json keeps one daily run as a backup). Minutes avoid :00, when GitHub most often delays runs.
# Needs two repository secrets: UNDERCUT_URL (the site address) and UNDERCUT_CRON_SECRET.
name: Check prices

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger the price check
        env:
          UNDERCUT_URL: ${{ secrets.UNDERCUT_URL }}
          UNDERCUT_CRON_SECRET: ${{ secrets.UNDERCUT_CRON_SECRET }}
        run: |
          secret="$(printf '%s' "$UNDERCUT_CRON_SECRET" | tr -d '\r\n')"
          url="$(printf '%s' "$UNDERCUT_URL" | tr -d '\r\n')"
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST -H "Authorization: Bearer ${secret}" \
            "${url%/}/api/cron"
